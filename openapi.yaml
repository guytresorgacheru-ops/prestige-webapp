openapi: 3.0.0
info:
  title: [Your App Name] API
  version: 1.0.0
paths:
  /claims:
    get:
      summary: Return claimed items with their reward amounts
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [claimed] # TODO: confirm other status values with team (pending? resolved?)
      responses:
        '200':
          description: A list of claims matching the given status.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [claimId, studentId, itemId, status, rewardAmountCents]
                  properties:
                    claimId:
                      type: string
                    studentId:
                      type: string
                    itemId:
                      type: string
                    status:
                      type: string
                    rewardAmountCents:
                      type: integer
                      example: 1500
  /students/{studentId}/claims:
    get:
      summary: Return a student's claims with current status
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of claims belonging to the given student.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [claimId, itemId, status, submittedAt]
                  properties:
                    claimId:
                      type: string
                    itemId:
                      type: string
                    status:
                      type: string
                    submittedAt:
                      type: string
                      format: date-time
                      example: "2026-07-01T09:15:00Z"
        '404':
          description: No student found with the given studentId.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    example: "student not found"
  /schools/{schoolId}/item-statistics:
    get:
      summary: Return aggregate lost-item statistics for a school
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Aggregate statistics for the given school.
          content:
            application/json:
              schema:
                type: object
                required: [schoolId, totalItemsReported, totalItemsClaimed, totalRewardAmountPaidCents]
                properties:
                  schoolId:
                    type: string
                  schoolName:
                    type: string
                    example: "Lakeside High School"
                  totalItemsReported:
                    type: integer
                    example: 214
                  totalItemsClaimed:
                    type: integer
                    example: 132
                  totalRewardAmountPaidCents:
                    type: integer
                    example: 198000
        '404':
          description: No school found with the given schoolId.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    example: "school not found"
